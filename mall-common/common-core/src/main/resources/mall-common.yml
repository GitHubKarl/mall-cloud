# ===================================================================
# 全服务共享配置（打包在 common-core 中，各服务用 spring.config.import 引入）
# 只放"各服务取值一致"的项：Redis、RabbitMQ、MyBatis-Plus、JWT、文档、日志。
# 端口、库名、ES 地址等差异化配置留在各服务自己的 application.yml。
# ===================================================================
spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  rabbitmq:
    host: ${MQ_HOST:127.0.0.1}
    port: ${MQ_PORT:5672}
    username: ${MQ_USERNAME:guest}
    password: ${MQ_PASSWORD:guest}
    virtual-host: ${MQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 2
        max-concurrency: 8
        # 消费失败重试 3 次后进入死信，避免无限重试打爆线程
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2.0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境请调整为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
    enable-swagger-models: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

mall:
  jwt:
    # 生产环境必须通过配置中心下发，并定期轮换；此处仅为本地开发默认值
    secret: ${JWT_SECRET:mall-cloud-default-secret-please-change-in-production-2026}
    access-token-expire: 7200
    refresh-token-expire: 604800
    issuer: mall-cloud
  swagger:
    enabled: true
    version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
    com.mallcloud: debug
    org.springframework.cloud.openfeign: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
