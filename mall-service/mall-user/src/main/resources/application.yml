server:
  port: 8101

spring:
  application:
    name: mall-user
  config:
    import: classpath:mall-common.yml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: MALL_CLOUD
      # 配置中心默认不接管，需要时改成 true 并在 spring.config.import 中加入 nacos:mall-user.yml
      config:
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/mall_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000

mall:
  swagger:
    title: mall-user 会员服务
    description: 注册登录、JWT 签发、收货地址、会员等级

feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 10000
